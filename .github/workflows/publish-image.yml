name: Publish OCI image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Tag to publish to GHCR
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build OCI image
        id: image
        run: echo "path=$(nix build --no-link --print-out-paths .#image)" >> "$GITHUB_OUTPUT"

      - name: Load OCI image
        env:
          IMAGE_TARBALL: ${{ steps.image.outputs.path }}
        run: docker load --input "$IMAGE_TARBALL"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push OCI image
        env:
          IMAGE_TAG: ${{ github.event.release.tag_name || inputs.image_tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker image tag: $IMAGE_TAG" >&2
            exit 1
          fi

          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag rust-nix-template:latest "$image_name:$IMAGE_TAG"
          docker push "$image_name:$IMAGE_TAG"
          docker tag rust-nix-template:latest "$image_name:latest"
          docker push "$image_name:latest"
